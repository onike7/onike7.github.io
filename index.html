
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>NIKE7 | Links Oficiais</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 400px;
    text-align: center;
}

/* FOTO DE PERFIL */
.perfil {
    width: 165px;
    height: 165px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #087cff;
    box-shadow: 0 0 25px #087cff90;
    margin-bottom: 20px;
}

/* NOME */
h1 {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px #087cff;
}

.subtitulo {
    color: #999;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

/* BOTÕES */
.links {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.botao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    width: 100%;
    padding: 17px;

    background: linear-gradient(90deg, #101010, #151b28);
    border: 1px solid #087cff;
    border-radius: 12px;

    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;

    transition: all 0.3s ease;
}

.botao:hover {
    background: #087cff;
    box-shadow: 0 0 25px #087cff;
    transform: scale(1.04);
}

/* ÍCONES */
.botao img {
    width: 30px;
    height: 30px;
    object-fit: contain;
}

/* RODAPÉ */
.rodape {
    color: #555;
    font-size: 11px;
    margin-top: 35px;
    letter-spacing: 2px;
}

/* CELULAR */
@media (max-width: 480px) {
    .perfil {
        width: 145px;
        height: 145px;
    }

    h1 {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- FOTO DE PERFIL -->
    <img
        src="foto perfil(1).jpeg"
        class="perfil"
        alt="NIKE7"
    >

    <!-- NOME -->
    <h1>NIKE7</h1>

    <p class="subtitulo">LINKS OFICIAIS</p>

    <div class="links">

        <!-- LIVE PIX -->
        <a
            href="https://livepix.gg/onike7"
            class="botao"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img src="pix_sem_fundo.png" alt="PIX">
            LIVE PIX
        </a>

        <!-- DISCORD -->
        <a
            href="https://discord.gg/MCJFa7PqKW"
            class="botao"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                src="discord-logo-discord-icon-transparent-free-png.webp"
                alt="Discord"
            >
            DISCORD
        </a>

        <!-- INSTAGRAM -->
        <a
            href="https://www.instagram.com/onike7_/"
            class="botao"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img src="instagram_sem_fundo.png" alt="Instagram">
            INSTAGRAM
        </a>

    </div>

    <p class="rodape">
        © 2026 NIKE7 • TODOS OS DIREITOS RESERVADOS
    </p>

</div>

</body>
</html>
